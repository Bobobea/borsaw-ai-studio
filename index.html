<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Borsaw AI Studio — TikTok API Demo</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, Arial, sans-serif; background: #f7f4ef; color: #111; }
    header { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.9); backdrop-filter: blur(12px); border-bottom: 1px solid #e5e5e5; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
    .nav { height: 76px; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; gap: 14px; align-items: center; }
    .logo { width: 48px; height: 48px; border-radius: 18px; background: #000; color: #fff; display: grid; place-items: center; font-weight: 900; }
    .brand h1 { font-size: 18px; margin: 0; }
    .brand p { margin: 3px 0 0; color: #71717a; font-size: 13px; }
    nav { display: flex; gap: 8px; }
    nav button { border: 0; background: transparent; padding: 10px 14px; border-radius: 14px; font-weight: 700; color: #555; cursor: pointer; }
    nav button.active, nav button:hover { background: #111; color: #fff; }
    .hero { display: grid; grid-template-columns: 1.1fr .9fr; gap: 56px; align-items: center; padding: 70px 0; }
    .pill { display: inline-flex; gap: 8px; align-items: center; padding: 9px 14px; background: #fff; border: 1px solid #e5e5e5; border-radius: 999px; font-weight: 800; color: #444; box-shadow: 0 6px 20px rgba(0,0,0,.04); }
    h2 { font-size: 64px; line-height: .96; letter-spacing: -3px; margin: 22px 0 0; }
    .lead { font-size: 18px; line-height: 1.7; color: #555; max-width: 640px; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
    .btn { border: 0; border-radius: 18px; padding: 15px 20px; font-weight: 900; cursor: pointer; transition: .2s; }
    .btn:active { transform: scale(.98); }
    .btn.primary { background: #000; color: #fff; }
    .btn.secondary { background: #fff; border: 1px solid #ddd; color: #111; }
    .btn.success { background: #059669; color: #fff; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .grid { display: grid; grid-template-columns: .95fr 1.05fr; gap: 24px; padding: 42px 0; }
    .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 32px; padding: 26px; box-shadow: 0 8px 30px rgba(0,0,0,.04); }
    .card h3 { margin: 0; font-size: 24px; }
    .muted { color: #71717a; line-height: 1.6; }
    .status { display: inline-flex; padding: 7px 11px; border-radius: 999px; font-size: 12px; font-weight: 900; background: #fef3c7; color: #92400e; }
    .status.ok { background: #d1fae5; color: #065f46; }
    .step { display: flex; gap: 16px; padding: 18px; border: 1px solid #eee; border-radius: 24px; background: #fafafa; margin-top: 12px; }
    .num { width: 40px; height: 40px; border-radius: 15px; background: #fff; display: grid; place-items: center; font-weight: 900; border: 1px solid #eee; flex: 0 0 auto; }
    .num.done { background: #059669; color: #fff; }
    .library { display: grid; gap: 12px; margin-top: 18px; }
    .video-choice { width: 100%; text-align: left; border: 1px solid #e5e5e5; background: #fff; border-radius: 24px; padding: 18px; cursor: pointer; }
    .video-choice.selected { background: #111; color: #fff; border-color: #111; }
    .phone { width: 330px; aspect-ratio: 9 / 16; border-radius: 38px; overflow: hidden; margin: 0 auto; position: relative; box-shadow: 0 30px 80px rgba(0,0,0,.25); background: linear-gradient(#f6c46e, #6b3d1f 45%, #111 100%); }
    .sun { position: absolute; right: 42px; top: 54px; width: 78px; height: 78px; background: rgba(255,255,230,.85); border-radius: 50%; }
    .mountain { position: absolute; bottom: 180px; left: -40px; width: 430px; height: 180px; background: #2d211c; clip-path: polygon(0 80%, 22% 30%, 42% 75%, 62% 20%, 100% 70%, 100% 100%, 0 100%); opacity: .92; }
    .phone-tag { position: absolute; top: 18px; left: 18px; background: rgba(0,0,0,.55); color: #fff; padding: 8px 12px; border-radius: 999px; font-size: 12px; font-weight: 900; }
    .phone-copy { position: absolute; bottom: 0; left: 0; right: 0; color: #fff; padding: 120px 22px 24px; background: linear-gradient(transparent, rgba(0,0,0,.95)); }
    .phone-copy h3 { font-size: 28px; line-height: 1.05; margin: 0; }
    .published { position: absolute; inset: 0; background: rgba(0,0,0,.65); display: grid; place-items: center; backdrop-filter: blur(8px); }
    .published-box { background: #fff; color: #111; border-radius: 26px; padding: 28px; text-align: center; width: 240px; }
    .check { width: 54px; height: 54px; margin: 0 auto 12px; border-radius: 50%; background: #059669; color: #fff; display: grid; place-items: center; font-size: 30px; font-weight: 900; }
    .legal { max-width: 880px; padding: 60px 0; }
    .legal h2 { font-size: 44px; letter-spacing: -1.5px; }
    .legal p { line-height: 1.8; color: #555; }
    footer { padding: 30px 0 60px; color: #777; text-align: center; }
    @media(max-width: 900px) {
      .hero, .grid { grid-template-columns: 1fr; }
      h2 { font-size: 46px; }
      nav { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [page, setPage] = useState("home");
      const [connected, setConnected] = useState(false);
      const [uploaded, setUploaded] = useState(false);
      const [published, setPublished] = useState(false);
      const [selected, setSelected] = useState("napoleon");

      const videos = [
        ["napoleon", "Napoleon: the emperor who changed Europe", "0:42 · Cinematic"],
        ["cleopatra", "Cleopatra: power, myth and survival", "0:51 · Dramatic"],
        ["columbus", "Columbus: the voyage that changed the world", "0:47 · Documentary"]
      ];

      function resetDemo() {
        setConnected(false);
        setUploaded(false);
        setPublished(false);
      }

      function Header() {
        return (
          <header>
            <div className="wrap nav">
              <div className="brand" onClick={() => setPage("home")} style={{cursor:"pointer"}}>
                <div className="logo">B</div>
                <div>
                  <h1>Borsaw AI Studio</h1>
                  <p>Historical short-form content</p>
                </div>
              </div>
              <nav>
                {["home","demo","privacy","terms","contact"].map(id => (
                  <button key={id} onClick={() => setPage(id)} className={page === id ? "active" : ""}>
                    {id === "demo" ? "Demo" : id.charAt(0).toUpperCase() + id.slice(1)}
                  </button>
                ))}
              </nav>
            </div>
          </header>
        )
      }

      function Phone() {
        return (
          <div className="phone">
            <div className="sun"></div>
            <div className="mountain"></div>
            <div className="phone-tag">Historical Short</div>
            <div className="phone-copy">
              <p style={{fontSize:12, letterSpacing:3, color:"#fed7aa", fontWeight:900}}>Borsaw AI Studio</p>
              <h3>{selected === "napoleon" ? "Napoleon: the emperor who changed Europe" : selected === "cleopatra" ? "Cleopatra: queen, strategist, legend" : "Columbus: the voyage that changed the world"}</h3>
              <p style={{color:"rgba(255,255,255,.75)", lineHeight:1.5}}>Script, visuals, narration and captions prepared for TikTok.</p>
            </div>
            {published && (
              <div className="published">
                <div className="published-box">
                  <div className="check">✓</div>
                  <h3 style={{margin:0}}>Published</h3>
                  <p className="muted">Visible on TikTok profile</p>
                </div>
              </div>
            )}
          </div>
        )
      }

      function Home() {
        return (
          <div className="wrap hero">
            <div>
              <div className="pill">✨ AI-assisted TikTok content workflow</div>
              <h2>Create historical short videos with AI, then publish to TikTok.</h2>
              <p className="lead">
                Borsaw AI Studio helps creators prepare educational and entertaining historical videos:
                scripts, visuals, narration, captions and final user-approved publishing workflow.
              </p>
              <div className="actions">
                <button className="btn primary" onClick={() => setPage("demo")}>Launch interactive demo</button>
                <button className="btn secondary" onClick={() => setPage("privacy")}>View privacy policy</button>
              </div>
            </div>
            <Phone />
          </div>
        )
      }

      function Demo() {
        return (
          <div className="wrap">
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"end", gap:20, paddingTop:36}}>
              <div>
                <div className="pill">TikTok Content Posting API demo</div>
                <h2 style={{fontSize:46, marginTop:18}}>Creator publishing dashboard</h2>
                <p className="muted">This demo shows explicit user actions for authentication, upload and publication.</p>
              </div>
              <button className="btn secondary" onClick={resetDemo}>Reset demo</button>
            </div>

            <div className="grid">
              <div>
                <div className="card">
                  <h3>TikTok connection</h3>
                  <p className="muted">User authentication and explicit consent before API usage.</p>
                  <div style={{marginTop:20}}>
                    <span className={connected ? "status ok" : "status"}>{connected ? "Connected as @borsawstudio" : "Not connected"}</span>
                  </div>
                  <button className="btn primary" style={{width:"100%", marginTop:24}} onClick={() => setConnected(true)} disabled={connected}>
                    Connect TikTok account
                  </button>
                </div>

                <div className="card" style={{marginTop:24}}>
                  <h3>Content library</h3>
                  <p className="muted">Select a user-created historical video.</p>
                  <div className="library">
                    {videos.map(v => (
                      <button key={v[0]} className={"video-choice " + (selected === v[0] ? "selected" : "")} onClick={() => setSelected(v[0])}>
                        <strong>{v[1]}</strong>
                        <div style={{marginTop:6, color:selected === v[0] ? "#ccc" : "#777"}}>{v[2]}</div>
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              <div style={{display:"grid", gridTemplateColumns:"330px 1fr", gap:24, alignItems:"start"}}>
                <Phone />
                <div>
                  <div className="card">
                    <h3>Publication workflow</h3>
                    <p className="muted">Every step is manually triggered by the authenticated user.</p>

                    <div className="step">
                      <div className={"num " + (connected ? "done" : "")}>{connected ? "✓" : "1"}</div>
                      <div>
                        <strong>Connect TikTok</strong>
                        <p className="muted" style={{margin:"6px 0 0"}}>Authenticate account with user consent.</p>
                      </div>
                    </div>

                    <div className="step">
                      <div className={"num " + (uploaded ? "done" : "")}>{uploaded ? "✓" : "2"}</div>
                      <div>
                        <strong>Upload video</strong>
                        <p className="muted" style={{margin:"6px 0 0"}}>Upload selected file using TikTok Content Posting API.</p>
                      </div>
                    </div>

                    <div className="step">
                      <div className={"num " + (published ? "done" : "")}>{published ? "✓" : "3"}</div>
                      <div>
                        <strong>Publish video</strong>
                        <p className="muted" style={{margin:"6px 0 0"}}>Publish only after user approval.</p>
                      </div>
                    </div>

                    <div className="actions">
                      <button className="btn secondary" onClick={() => setUploaded(true)} disabled={!connected || uploaded}>Upload to TikTok</button>
                      <button className="btn success" onClick={() => setPublished(true)} disabled={!uploaded || published}>{published ? "Published" : "Approve & publish"}</button>
                    </div>
                  </div>

                  <div className="card" style={{marginTop:24, background:"#111", color:"#fff"}}>
                    <h3>Compliance note</h3>
                    <p style={{color:"#d4d4d8", lineHeight:1.7}}>
                      The app does not perform mass posting, scraping or unauthorized publishing.
                      Upload and publish actions are initiated by the authenticated user.
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        )
      }

      function Legal({type}) {
        const privacy = type === "privacy";
        return (
          <div className="wrap legal">
            <div className="card">
              <h2>{privacy ? "Privacy Policy" : "Terms of Service"}</h2>
              <p><strong>Last updated:</strong> May 19, 2026</p>
              {privacy ? (
                <>
                  <p>Borsaw AI Studio respects user privacy and uses data only to provide application functionality.</p>
                  <p>The application may use TikTok APIs to authenticate users and support user-approved content publishing workflows.</p>
                  <p>We do not sell personal information. Contact: natelycreative@gmail.com</p>
                </>
              ) : (
                <>
                  <p>Borsaw AI Studio provides AI-assisted tools for educational and entertainment media creation.</p>
                  <p>Users are responsible for complying with TikTok policies, copyright rules, and applicable laws when publishing content.</p>
                  <p>The service is provided as is, without guarantees of availability or performance. Contact: natelycreative@gmail.com</p>
                </>
              )}
            </div>
          </div>
        )
      }

      function Contact() {
        return (
          <div className="wrap legal">
            <div className="card">
              <h2>Contact</h2>
              <p>For app review questions, privacy inquiries or product support:</p>
              <p><strong>natelycreative@gmail.com</strong></p>
            </div>
          </div>
        )
      }

      return (
        <>
          <Header />
          {page === "home" && <Home />}
          {page === "demo" && <Demo />}
          {page === "privacy" && <Legal type="privacy" />}
          {page === "terms" && <Legal type="terms" />}
          {page === "contact" && <Contact />}
          <footer>© 2026 Borsaw AI Studio — Educational historical storytelling tools</footer>
        </>
      )
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
