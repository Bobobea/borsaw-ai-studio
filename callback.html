<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Login Callback</title>
  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f7f4ef;
      font-family:Arial,sans-serif;
      color:#111;
    }

    .box{
      background:white;
      padding:50px;
      border-radius:24px;
      box-shadow:0 15px 50px rgba(0,0,0,0.08);
      text-align:center;
      max-width:520px;
      border:1px solid #e5e5e5;
    }

    .icon{
      width:72px;
      height:72px;
      border-radius:50%;
      background:#10b981;
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:38px;
      margin:0 auto 24px;
      font-weight:bold;
    }

    h1{
      margin:0 0 16px;
      font-size:32px;
    }

    p{
      margin:0;
      color:#555;
      line-height:1.7;
      font-size:17px;
    }

    .brand{
      margin-top:30px;
      color:#999;
      font-size:14px;
    }
  </style>
</head>
<body>

  <div class="box">
    <div class="icon">✓</div>

    <h1>Authentication successful</h1>

    <p>
      Your TikTok account has been connected successfully.<br>
      You can now return to the application.
    </p>

    <div class="brand">
      Borsaw AI Studio
    </div>
  </div>

</body>
</html>
